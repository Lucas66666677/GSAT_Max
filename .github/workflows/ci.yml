name: GSAT_Max CI

on:
  push:
  pull_request:
  workflow_dispatch:
      inputs:
        api_base_url:
          description: "Backend API base URL for the Flutter web build"
          required: true
          default: "/api"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q backend
      - run: python -m pytest backend/tests -q

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=APP_ENV=production --dart-define=API_BASE_URL=${{ github.event_name == 'workflow_dispatch' && inputs.api_base_url || '/api' }}
      - run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:8000
      - uses: actions/upload-artifact@v4
        with:
          name: gsat-max-website
          path: build/web
      - uses: actions/upload-artifact@v4
        with:
          name: gsat-max-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
