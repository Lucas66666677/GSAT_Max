name: gsat_max
description: GSAT Max by Lucirel - A Flutter app for Taiwanese high school students preparing for the English GSAT.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.2
  flutter_secure_storage: ^9.2.4
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  flutter_local_notifications: ^17.2.4
  flutter_timezone: 5.1.0
  audioplayers: ^6.1.0
  confetti: ^0.8.0
  http: ^1.6.0
  image_picker: ^1.2.2
  open_file: ^3.5.10
  path_provider: ^2.1.5
  purchases_flutter: ^8.4.4
  share_plus: ^10.0.2
  shared_preferences: ^2.3.2
  timezone: ^0.9.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/brand/
  fonts:
    - family: NotoSansTC
      fonts:
        - asset: backend/assets/fonts/NotoSansTC-Regular.ttf
